---
name: Build Kobold ISO

"on":
  workflow_dispatch:
  push:
    branches:
      - agent/initial-iso-infrastructure

env:
  OCI_REPO: "ghcr.io/lnx89f/kobold-bluefin"
  OCI_TAG: "latest"
  ARCHITECTURE: "amd64"
  BLUEFIN_ISO_PIN: "d34ce2b7727422cb0d89ebdd2bda4fc0fe40523a"
  TITANOBOA_PIN: "840217d97bd0bc9a52466508c54d8dda5c5ba2fd"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and validate amd64 ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout Kobold
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.57.0"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.2"

      - name: Install build and test dependencies
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == x86_64 ]]
          sudo apt-get update
          sudo apt-get install --yes \
            ffmpeg \
            podman \
            python3-yaml \
            qemu-system-x86 \
            qemu-utils \
            shellcheck \
            skopeo \
            xorriso

      - name: Enable KVM acceleration for VM gates
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run static checks
        run: |
          set -euo pipefail
          SHELLCHECK_OPTS='--exclude=SC2001,SC2015,SC2016,SC2251' bash tests/static.sh
          bash tests/iso-static.sh
          shellcheck \
            iso_files/kobold-overlay.sh \
            iso_files/kobold-pre-initramfs.sh \
            tests/iso-static.sh
          just check

      - name: Resolve and verify OCI candidate
        id: candidate
        env:
          OCI_REF: ${{ env.OCI_REPO }}:${{ env.OCI_TAG }}
        run: |
          set -euo pipefail
          digest="$(skopeo inspect --retry-times 3 --format '{{.Digest}}' "docker://${OCI_REF}")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign verify --key cosign.pub "${OCI_REPO}@${digest}"

          alias_tag="latest-${GITHUB_SHA::7}"
          alias_ref="${OCI_REPO}:${alias_tag}"
          if alias_json="$(skopeo inspect --retry-times 3 "docker://${alias_ref}" 2>"${RUNNER_TEMP}/alias-error.log")"; then
            alias_digest="$(jq -r .Digest <<<"${alias_json}")"
            [[ "${alias_digest}" == "${digest}" ]] || {
              echo "Source alias ${alias_ref} points to ${alias_digest}, expected ${digest}." >&2
              exit 1
            }
            echo "source_alias=${alias_ref}" >>"${GITHUB_OUTPUT}"
          elif grep -Eqi 'manifest unknown|name unknown|not found' "${RUNNER_TEMP}/alias-error.log"; then
            echo "::notice::Optional source alias ${alias_ref} is not available."
            echo "source_alias=unavailable" >>"${GITHUB_OUTPUT}"
          else
            cat "${RUNNER_TEMP}/alias-error.log" >&2
            exit 1
          fi

          {
            echo "digest=${digest}"
            echo "ref=${OCI_REF}"
            echo "OCI_DIGEST=${digest}"
            echo "OCI_REF=${OCI_REF}"
          } | tee -a "${GITHUB_OUTPUT}" >>"${GITHUB_ENV}"
          printf '### OCI candidate\n\n- Ref: `%s`\n- Digest: `%s`\n' \
            "${OCI_REF}" "${digest}" >>"${GITHUB_STEP_SUMMARY}"

      - name: Validate normal OCI boundary
        run: |
          set -euo pipefail
          podman run --rm --entrypoint /usr/bin/bash "${OCI_REPO}@${OCI_DIGEST}" -c '
            set -euo pipefail
            grep -Eq '\''^ID=bluefin$|^ID="bluefin"$'\'' /usr/lib/os-release
            [[ "$(jq -r '\''."image-name"'\'' /usr/share/ublue-os/image-info.json)" == kobold-bluefin ]]
            [[ "$(jq -r '\''."image-vendor"'\'' /usr/share/ublue-os/image-info.json)" == lnx89f ]]
            for package in anaconda-live dracut-live livesys-scripts; do
              ! rpm -q "${package}" >/dev/null 2>&1
            done
          '

      - name: Checkout pinned ISO sources
        run: |
          set -euo pipefail
          bluefin_iso_dir="${RUNNER_TEMP}/projectbluefin-iso"
          titanoboa_dir="${RUNNER_TEMP}/titanoboa"

          git clone --filter=blob:none --no-checkout https://github.com/projectbluefin/iso.git "${bluefin_iso_dir}"
          git -C "${bluefin_iso_dir}" checkout --detach "${BLUEFIN_ISO_PIN}"
          [[ "$(git -C "${bluefin_iso_dir}" rev-parse HEAD)" == "${BLUEFIN_ISO_PIN}" ]]

          git clone --filter=blob:none --no-checkout https://github.com/ublue-os/titanoboa.git "${titanoboa_dir}"
          git -C "${titanoboa_dir}" checkout --detach "${TITANOBOA_PIN}"
          [[ "$(git -C "${titanoboa_dir}" rev-parse HEAD)" == "${TITANOBOA_PIN}" ]]

          sed -i '1a set lists' "${titanoboa_dir}/Justfile"
          install -m 0644 \
            "${bluefin_iso_dir}/iso_files/configure_iso_anaconda.sh" \
            "${titanoboa_dir}/bluefin-configure-iso-anaconda.sh"
          install -m 0755 \
            "${GITHUB_WORKSPACE}/iso_files/kobold-overlay.sh" \
            "${titanoboa_dir}/kobold-overlay.sh"

          combined_hook="${titanoboa_dir}/kobold-combined-hook.sh"
          cat >"${combined_hook}" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          bash /app/bluefin-configure-iso-anaconda.sh
          bash /app/kobold-overlay.sh
          EOF
          chmod 0755 "${combined_hook}"

          {
            echo "BLUEFIN_ISO_DIR=${bluefin_iso_dir}"
            echo "TITANOBOA_DIR=${titanoboa_dir}"
            echo "COMBINED_HOOK=${combined_hook}"
          } >>"${GITHUB_ENV}"

      - name: Build ISO with pinned Titanoboa
        run: |
          set -euo pipefail
          just_bin="$(command -v just)"
          sudo \
            env PATH="${PATH}" \
            CI="${CI}" \
            HOOK_pre_initramfs="${GITHUB_WORKSPACE}/iso_files/kobold-pre-initramfs.sh" \
            HOOK_post_rootfs="${COMBINED_HOOK}" \
            TITANOBOA_BUILDER_DISTRO=fedora \
            "${just_bin}" -f "${TITANOBOA_DIR}/Justfile" build \
            "${OCI_REF}" 1 "${GITHUB_WORKSPACE}/iso_files/flatpaks.list" \
            squashfs NONE "${OCI_REF}" 1
          sudo chown "$(id -u):$(id -g)" "${TITANOBOA_DIR}/output.iso"
          mv "${TITANOBOA_DIR}/output.iso" output.iso

      - name: Validate ISO structure
        run: |
          set -euo pipefail
          test -s output.iso
          xorriso -indev output.iso -report_el_torito plain 2>&1 | grep -q 'El Torito'
          for iso_path in \
            /boot/vmlinuz \
            /boot/initramfs.img \
            /boot/grub/grub.cfg \
            /EFI/BOOT/BOOTX64.EFI \
            /LiveOS/squashfs.img; do
            xorriso -indev output.iso -ls "${iso_path}" >/dev/null
          done

      - name: Create ISO manifest and checksum
        id: artifact
        run: |
          set -euo pipefail
          filename="kobold-bluefin-${OCI_TAG}-${ARCHITECTURE}.iso"
          mkdir -p output
          mv output.iso "output/${filename}"
          sha256sum "output/${filename}" | tee "output/${filename}.sha256"
          iso_sha256="$(awk '{print $1}' "output/${filename}.sha256")"
          jq -n \
            --arg source_repo_sha "${GITHUB_SHA}" \
            --arg oci_ref "${OCI_REF}" \
            --arg oci_tag "${OCI_TAG}" \
            --arg oci_digest "${OCI_DIGEST}" \
            --arg projectbluefin_iso_pin "${BLUEFIN_ISO_PIN}" \
            --arg titanoboa_pin "${TITANOBOA_PIN}" \
            --arg architecture "${ARCHITECTURE}" \
            --arg filename "${filename}" \
            --arg iso_sha256 "${iso_sha256}" \
            '{
              source_repo_sha: $source_repo_sha,
              oci_ref: $oci_ref,
              oci_tag: $oci_tag,
              oci_digest: $oci_digest,
              projectbluefin_iso_pin: $projectbluefin_iso_pin,
              titanoboa_pin: $titanoboa_pin,
              architecture: $architecture,
              filename: $filename,
              iso_sha256: $iso_sha256
            }' >"output/${filename}.manifest.json"
          {
            echo "filename=${filename}"
            echo "path=${GITHUB_WORKSPACE}/output/${filename}"
          } >>"${GITHUB_OUTPUT}"

      - name: Run pinned upstream smoke harness
        run: |
          set -euo pipefail
          bash "${BLUEFIN_ISO_DIR}/tests/iso/smoke.sh" \
            "${{ steps.artifact.outputs.path }}" smoke-output

      - name: Run pinned upstream E2E install harness
        env:
          IMAGE_REF: ghcr.io/lnx89f/kobold-bluefin
          IMAGE_TAG: latest
        run: |
          set -euo pipefail
          git -C "${BLUEFIN_ISO_DIR}" apply --unidiff-zero \
            "${GITHUB_WORKSPACE}/tests/iso-e2e-harness.patch"
          bash -n "${BLUEFIN_ISO_DIR}/tests/iso/e2e.sh"
          bash "${BLUEFIN_ISO_DIR}/tests/iso/e2e.sh" \
            "${{ steps.artifact.outputs.path }}" e2e-output

      - name: Revalidate latest digest and finalize candidate
        run: |
          set -euo pipefail
          final_digest="$(skopeo inspect --retry-times 3 --format '{{.Digest}}' "docker://${OCI_REPO}:${OCI_TAG}")"
          if [[ "${final_digest}" != "${OCI_DIGEST}" ]]; then
            jq -n \
              --arg status invalid \
              --arg reason oci-tag-drift \
              --arg initial_digest "${OCI_DIGEST}" \
              --arg final_digest "${final_digest}" \
              '{status: $status, reason: $reason, initial_digest: $initial_digest, final_digest: $final_digest}' \
              >output/candidate-status.json
            mv "${{ steps.artifact.outputs.path }}" "${{ steps.artifact.outputs.path }}.invalid"
            echo "OCI tag moved during the build or validation; candidate invalidated." >&2
            exit 1
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kobold-iso-validation-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            smoke-output/
            e2e-output/
            !e2e-output/installed.qcow2
            output/candidate-status.json

      - name: Upload validated ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kobold-iso-${{ github.run_id }}-amd64
          if-no-files-found: error
          compression-level: 0
          path: |
            output/${{ steps.artifact.outputs.filename }}
            output/${{ steps.artifact.outputs.filename }}.sha256
            output/${{ steps.artifact.outputs.filename }}.manifest.json
